name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # No secrets configured anywhere in this workflow, so every session runs against
      # MockSttProvider (the default) - CI never talks to a real STT backend.
      - run: npm test

      - run: npm run build
